name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 应用核心回归（字数/预检/解析/校验/合并）
        run: node app/test.mjs

      - name: 代理内核回归（CORS/配额/上游约束）
        run: node proxy/proxy-core.test.mjs

      - name: 桌面壳静态服务器回归（目录暴露/路径穿越/崩溃防护）
        run: node app/static-server.test.mjs

      - name: 跨实现一致性（JS 与 Python 必须同口径）
        run: node app/parity.mjs

      - name: DSH 插件回归（清单契约 / provider / 随包资源完整性）
        run: |
          python scripts/sync_app.py
          node dsh-plugin/test.mjs

      - name: 副本无漂移（代理内核与 app/ 副本必须与真源一致）
        run: python scripts/sync_app.py --check

      - name: README 自检（路径 / 锚点 / 断言数必须与仓库一致）
        run: node scripts/check_readme.mjs

      - name: 评分脚本冒烟（预检 / 报告校验 / 评估器语法）
        run: |
          cd skill/kaoyan-essay
          python scripts/precheck.py --track english-ii --task large tests/fixtures/essay-synthetic-flawed.txt > /dev/null
          python scripts/precheck.py --track english-i --task small tests/fixtures/essay-synthetic-small.txt > /dev/null
          python scripts/validate_report.py ../../docs/validation/2026-10-08/graderA.json tests/fixtures/essay-synthetic-flawed.txt
          python scripts/validate_report.py ../../docs/validation/2026-10-08/graderB.json tests/fixtures/essay-synthetic-flawed.txt
          python -m py_compile scripts/eval_planted.py scripts/average_reports.py scripts/precheck.py scripts/validate_report.py
          echo "评分脚本冒烟通过"
